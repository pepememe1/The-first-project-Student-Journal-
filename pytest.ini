[pytest]
# Тесты КЛИЕНТА (логика без GUI). Запуск из корня репозитория:  pytest
# Код разложен по папкам (ui/ sync/ data/), импорты остались плоскими (from core import ...),
# поэтому добавляем эти папки в pythonpath — модули находятся без переписывания импортов.
# Корень (.) нужен для модулей, оставшихся в корне (app_paths, fonts, server_control, grading...).
# testpaths=tests ограничивает сбор папкой tests/ (серверные тесты — отдельно: cd server && pytest).
pythonpath = . ui sync data
testpaths = tests
