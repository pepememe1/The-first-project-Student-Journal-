[pytest]
# Тесты КЛИЕНТА (логика без GUI). Запуск из корня репозитория:  pytest
#
# pythonpath — ТОЛЬКО корень. Раньше здесь стояло «. ui sync data»: код лежал по папкам,
# а импортировался плоско (`from core import ...`), и подпапки приходилось класть в путь
# поиска — тот же приём, что делал удалённый `_bootstrap.py`. Теперь desktop/ (бывшая
# ui/), sync/ и data/ — обычные пакеты (`from data.core import ...`), и подкладывать
# ничего не нужно.
#
# ⚠️ Это не косметика: при двух путях один и тот же файл, импортированный и как `core`,
# и как `data.core`, давал ДВА разных объекта модуля — со своими классами и своим
# состоянием. Для DBManager это означало две независимые «единственные» точки доступа
# к базе, и поймать такое можно было только по необъяснимому поведению.
pythonpath = .
testpaths = tests
