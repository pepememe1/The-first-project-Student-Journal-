<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Synapse — анимация логотипа (прототип 3)</title>

<!--
  ПРОТОТИП ДЛЯ СВЕРКИ. Третья редакция, 07.09.2026.

  🔥 ГЛАВНОЕ ОТЛИЧИЕ ОТ ДВУХ ПРЕДЫДУЩИХ: здесь НИЧЕГО НЕ НАРИСОВАНО ПО ОПИСАНИЮ.
  Все контуры — и знак, и буквы — ОБВЕДЕНЫ ПО ПИКСЕЛЯМ референса `ref/ref-b.jpg`
  скриптом (маска по насыщенности → marching squares → Дуглас–Пекер). Две прошлые
  редакции я рисовал «по мотивам увиденного», и обе вышли мимо: у настоящей «A» в этой
  гарнитуре НЕТ ни перекладины, ни просвета (это чистая «Λ»), у «P» и «S» скруглённые
  углы, а «S» знака — не трапеции, а два шеврона с параллелограммом между ними.
  Пиксели не спорят.

  Сценарий:
    1. покой   — в шестиугольнике ВЕРХНИЙ и НИЖНИЙ шевроны, перемычки между ними НЕТ;
                 вокруг — малые шестиугольники на ТРЁХ орбитальных слоях;
    2. нажатие — орбиты сжимаются, шестиугольники уменьшаются и уходят внутрь;
                 два садятся контактами по краям разрыва «S»;
    3. между ними бьёт молния;
    4. после удара появляется ПЕРЕМЫЧКА — «S» замыкается;
    5. белая вспышка;
    6. справа выезжает «YNAPSE»;
    7. дальше логотип едва заметно пульсирует.

  Вся хореография — в CFG, одним объектом.
-->

<style>
  :root {
    --bg: #071624; --bg-2: #0b2035;
    --panel: rgba(10,28,45,.82); --panel-line: rgba(90,230,190,.22);
    --text: #b9d6e4; --text-dim: #6d8b9c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(1100px 620px at 50% 42%, var(--bg-2), var(--bg) 68%);
    color: var(--text);
    font: 500 14px/1.5 "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .stage {
    width: min(96vw, 1180px); display: grid; place-items: center;
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .stage:focus-visible { outline: 2px solid #35e0b0; outline-offset: 12px; border-radius: 18px; }
  svg.logo { width: 100%; height: auto; display: block; overflow: visible; }

  /*
    Вспышка и пульс — ФИЛЬТРОМ по всему логотипу, а не второй белой копией фигур: копию
    пришлось бы двигать теми же анимациями, и рассинхрон на кадр читался бы как двоение.
    `saturate(0) brightness(N)` гасит цвет и выбивает яркость в потолок — форма остаётся
    та же, потому что это тот же самый объект.
  */
  #logo { filter: none; will-change: filter; }

  .hint {
    margin-top: 22px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--text-dim); transition: opacity .5s ease;
  }
  .hint.gone { opacity: 0; }

  .dev {
    position: fixed; right: 14px; bottom: 14px; z-index: 5;
    background: var(--panel); border: 1px solid var(--panel-line);
    border-radius: 12px; padding: 12px 14px; backdrop-filter: blur(8px);
    display: grid; gap: 9px; min-width: 236px; font-size: 12px;
  }
  .dev h2 {
    margin: 0 0 2px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--text-dim); font-weight: 600;
  }
  .dev label { display: grid; gap: 4px; }
  .dev .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .dev input[type=range] { width: 100%; }
  .dev button {
    background: linear-gradient(92deg, #2BE86F, #22D3EE); color: #04121d; border: 0;
    border-radius: 8px; padding: 8px 10px;
    font: 700 12px/1 "Inter", system-ui, sans-serif; letter-spacing: .06em; cursor: pointer;
  }
  .dev button:active { transform: translateY(1px); }
  .dev .val { color: #7fe9c8; font-variant-numeric: tabular-nums; }
  .dev .note { color: var(--text-dim); margin: 2px 0 0; line-height: 1.35; }
  .dev.hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { .hint { display: none; } }
</style>
</head>
<body>

<div class="stage" id="stage" role="button" tabindex="0"
     aria-label="Логотип Synapse — нажмите, чтобы проиграть анимацию">
  <svg class="logo" id="svg" viewBox="-150 -140 1440 680" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <!--
        ⚠️ КООРДИНАТЫ ГРАДИЕНТОВ — В СИСТЕМЕ ТОЙ ГРУППЫ, ГДЕ ЛЕЖИТ ФИГУРА, а не листа.
        `userSpaceOnUse` считает их у ССЫЛАЮЩЕЙСЯ фигуры; знак лежит в `translate(200,200)`,
        слово — в своей группе со своим масштабом. Ошибался тут дважды в одном файле:
        градиент уезжал за фигуру, и она красилась ОДНИМ первым цветом. Выглядит
        правдоподобно, ошибок нигде — ловится только глазами.
      -->
      <!--
        ══ ПОДЛОЖКА: ЦВЕТ ПРИНАДЛЕЖИТ ФОНУ, А НЕ ФИГУРЕ ══

        Идея Влада: «будто вырез в тёмно-синем фоне, через разрезы которого видно
        градиент». Поэтому цветных фигур в этом файле больше НЕТ ни одной. Есть один
        прямоугольник с зелёно-синим градиентом на весь лист и маска `logoMask`, в
        которой лежит весь логотип белым. Видно только то, что маска пропускает.

        🔥 ЭТО НЕ УКРАШЕНИЕ, А СМЕНА МОДЕЛИ, И ОНА ЧИНИТ СТАРУЮ ПРОБЛЕМУ. Раньше каждая
        фигура несла свой градиент, и у вращающихся приходилось ставить СПЛОШНОЙ цвет:
        `userSpaceOnUse` считает градиент в координатах самой фигуры, то есть он крутился
        вместе с ней и брал случайный кусок шкалы («узлы темнеют и мигают на ходу»).
        Здесь градиент стоит НЕПОДВИЖНО в координатах листа, а фигуры ездят по нему —
        и то, что было дефектом, стало ровно тем эффектом, который просили: форма
        проезжает над шкалой и меняет цвет.

        ⚠️ Стопы разложены ПО ЗАМЕРУ, а не на глаз. Проекция фигур на ось градиента
        посчитана: знак занимает t от 0.133 до 0.392, слово — от 0.375 до 0.866. Поэтому
        зелёная часть шкалы (0.13…0.39) отдана знаку целиком, а бирюза с синевой — слову.
        Первая редакция ставила стопы равномерно, и знак целиком попал в бирюзовый
        участок: логотип вышел одноцветным, то есть «менять цвет» на вращении было нечему.
        Двигаешь знак по листу (`lockIdle`/`lockFinal`) — пересчитай проекцию.
      -->
      <linearGradient id="gradBack" gradientUnits="userSpaceOnUse"
                      x1="-150" y1="-140" x2="1290" y2="540">
        <stop offset="0"    stop-color="#8CFAB8" />
        <stop offset="0.13" stop-color="#8CFAB8" />
        <stop offset="0.20" stop-color="#17B45E" />
        <stop offset="0.28" stop-color="#10A98D" />
        <stop offset="0.39" stop-color="#2FE3B4" />
        <stop offset="0.66" stop-color="#26CFE4" />
        <stop offset="1"    stop-color="#22D3EE" />
      </linearGradient>

      <!--
        Вертикальный рез боковых граней «S». Ширина = 2 × апофема (80.54): рез идёт
        точно по осевой линии убираемой грани, как на эскизе.
      -->
      <clipPath id="sClip" clipPathUnits="userSpaceOnUse">
        <rect x="-80.54" y="-240" width="161.08" height="480" />
      </clipPath>

      <!--
        Отступ вокруг контактов. ОДНА маска на дуги и на перемычку: просвет тогда
        одинаков по построению, а не потому что подобрали два похожих числа.
        Вырез — шестиугольник с апофемой «внешний край контакта + 7».
        ⚠️ Вырезы РАСТУТ вместе с посадкой контактов (см. carveL/carveR в скрипте): в
        покое их нет вовсе, иначе дуги были бы надкушены там, где ещё ничего не стоит.
      -->
      <mask id="sCarve" maskUnits="userSpaceOnUse" x="-260" y="-260" width="520" height="520">
        <rect x="-260" y="-260" width="520" height="520" fill="#fff" />
        <g id="carveL" transform="translate(-80.54,-46.5) scale(0)">
          <polygon points="0,-37.62 32.58,-18.81 32.58,18.81 0,37.62 -32.58,18.81 -32.58,-18.81"
                   fill="#000" />
        </g>
        <g id="carveR" transform="translate(80.54,46.5) scale(0)">
          <polygon points="0,-37.62 32.58,-18.81 32.58,18.81 0,37.62 -32.58,18.81 -32.58,-18.81"
                   fill="#000" />
        </g>
      </mask>

      <clipPath id="wordClip">
        <rect id="wordClipRect" x="366" y="90" width="0" height="220" />
      </clipPath>
    </defs>

    <!--
      ДВЕ ОБЁРТКИ, А НЕ ОДНА. #lockup двигает замок по горизонтали, #logo вспыхивает и
      пульсирует. Свали обе роли на один элемент — и `filter` со `transform` будут драться
      за него двумя анимациями: та, что начнётся позже, отменит первую.
    -->
    <!--
      ВЕСЬ ЛОГОТИП ЖИВЁТ В МАСКЕ И НАРИСОВАН БЕЛЫМ. Видимый объект ровно один — цветной
      прямоугольник ниже; маска решает, где его видно. Поэтому «поменять палитру» здесь
      означает поправить ОДИН градиент, а не N заливок, которые однажды разъедутся.
    -->
    <mask id="logoMask" maskUnits="userSpaceOnUse" x="-400" y="-400" width="2200" height="1400">
      <!--
        ⚠️ ЗДЕСЬ НЕТ ГОРИЗОНТАЛЬНОГО СДВИГА, И ЭТО ВАЖНО. Замок двигает ПОДЛОЖКУ (см.
        `#lockup` ниже), а маска и градиент живут в её системе координат и едут вместе с
        ней. Поставь сдвиг ещё и тут — он сложится вдвое; а если двигать только маску,
        логотип поедет ПО неподвижному градиенту и на переезде сменит цвет целиком:
        в покое бирюзовый, в собранном зелёный. Проверено — выглядит как поломка, а не
        как задумка. Цвет обязано менять ВРАЩЕНИЕ, а не переезд.
      -->
      <g id="logoShapes">
      <g id="logo">

        <!-- ══ ЗНАК ══ Центр знака — (200,200); дети считают координаты от него. ══ -->
        <g transform="translate(200,200)">

          <!--
            Большой шестиугольник — ПРАВИЛЬНЫЙ, построенный, а не обведённый, и это
            осознанно. Обводка дала 10 вершин вместо шести: лишние — шум JPEG и свечения
            у острой макушки. Форма здесь известна точно (правильный остроконечный
            шестиугольник; замер по референсу дал отношение ширины к высоте 0.8608 при
            идеальных 0.8660 — то есть это он и есть), поэтому строить честнее, чем
            копировать артефакты сжатия.
            Радиус осевой линии и толщина сняты с обводки: внешний R=170, внутренний 148.6.
          -->
          <g id="hexBig">
            <polygon points="0,-159.3 137.96,-79.65 137.96,79.65 0,159.3 -137.96,79.65 -137.96,-79.65"
                     fill="none" stroke="#fff" stroke-width="18.4" stroke-linejoin="miter" />
          </g>

          <!--
            ══ «S» — ЭТО САМ ШЕСТИУГОЛЬНИК С ОТРЕЗАННЫМИ БОКОВЫМИ ГРАНЯМИ ══

            Построение по разбору Влада (эскиз `ref/howto.png`, красным «что вырезается»,
            зелёным «что добавляется»), а НЕ обводка растра. Прошлые две редакции обводили
            «S» по пикселям — форма выходила похожей, но у перемычки оставался ОБРУБОК:
            её конец висел в воздухе, потому что обводка не знала, что он обязан упираться
            в контакт. У построения такой болезни нет по устройству.

            Как собрано:
            • берётся шестиугольник (осевой радиус 93, обводка 44) — тот же остроконечный,
              что и рамка, только меньше и толще;
            • ВЕРТИКАЛЬНЫЕ грани отрезаются ровной вертикалью на |x| = 80.54 (это апофема,
              то есть рез идёт точно по осевой линии убираемой грани). Остаются две верхние
              грани «Λ» и две нижние «V» — они и есть верх и низ буквы;
            • контакты садятся серединой на КОНЦЫ этих дуг: левый на нижне-левый конец «Λ»
              (−80.54,−46.5), правый на верхне-правый конец «V» (80.54, 46.5). Это вершины того
              же шестиугольника, поэтому места посадки не подбираются, а вычисляются;
            • перемычка идёт от контакта к контакту — и ложится РОВНО под 30°, тем же углом,
              под каким наклонены грани. Это не совпадение: оба конца лежат на вершинах
              одной фигуры;
            • вокруг контактов всё вырезается с отступом (маска `sCarve`) — «рисуется не
              вплотную». Один вырез обслуживает и дуги, и перемычку, поэтому просвет у них
              одинаковый по построению, а не потому что подобрали два похожих числа.
          -->
          <g id="sMark" mask="url(#sCarve)">
            <!-- Обрезка вертикалью: ровно то, что на эскизе помечено красными
                 прямоугольниками. Дуги нарочно продлены за вершину (до x = ±92), чтобы рез
                 делала обрезка, а не торец штриха: у торца срез перпендикулярен грани,
                 то есть наклонный, а нужен вертикальный. -->
            <g clip-path="url(#sClip)">
              <path id="sTop" d="M -92,-39.88 L 0,-93 L 92,-39.88"
                    fill="none" stroke="#fff" stroke-width="44"
                    stroke-linejoin="miter" stroke-linecap="butt" />
              <path id="sBot" d="M 92,39.88 L 0,93 L -92,39.88"
                    fill="none" stroke="#fff" stroke-width="44"
                    stroke-linejoin="miter" stroke-linecap="butt" />
            </g>
            <!-- Перемычка. Появляется после молнии; концы уходят под вырезы у контактов,
                 поэтому обрубка быть не может: где кончается полоса, решает не её длина,
                 а маска вокруг контакта. -->
            <path id="sLink" opacity="0" d="M -89.2,-51.5 L 89.2,51.5"
                  fill="none" stroke="#fff" stroke-width="40" stroke-linecap="butt" />
          </g>

          <!--
            ══ ДВА ВНЕШНИХ СЛОЯ — ЭТО ТЕ ЖЕ КОНТАКТЫ, ТОЛЬКО БОЛЬШИЕ ══
            Многоугольник у них РОВНО ТОТ ЖЕ, что у контакта (осевая 31.3), в покое он
            просто увеличен `scale`. Заведи их отдельными фигурами — и пришлось бы гасить
            одни ровно в тот кадр, когда появляются другие, то есть подделывать превращение
            склейкой. Здесь превращать нечего: это один и тот же объект.

            ⚠️ `vector-effect="non-scaling-stroke"` — обводка НЕ масштабируется с фигурой.
            Без него в покое линия была бы толщиной под 40 единиц, то есть жирнее грани
            знака, а привести её к нужным 5.9 можно было бы только встречной анимацией
            `stroke-width` — вторым правилом там, где хватает одного.

            ⚠️ Цвет СПЛОШНОЙ: фигура вращается, а `userSpaceOnUse` считает градиент в её
            собственных координатах — он крутился бы вместе с ней и брал случайный кусок
            шкалы. Цвета взяты с концов той же шкалы и совпадают с местом посадки.
          -->
          <g id="hexMid">
            <polygon points="0,-27 23.38,-13.5 23.38,13.5 0,27 -23.38,13.5 -23.38,-13.5"
                     fill="none" stroke="#fff" stroke-width="5.4"
                     vector-effect="non-scaling-stroke" />
          </g>
          <g id="hexOut">
            <polygon points="0,-27 23.38,-13.5 23.38,13.5 0,27 -23.38,13.5 -23.38,-13.5"
                     fill="none" stroke="#fff" stroke-width="5.4"
                     vector-effect="non-scaling-stroke" />
          </g>
        </g>

        <!--
          ══ «YNAPSE» — КОНТУРЫ, ОБВЕДЁННЫЕ ПО РЕФЕРЕНСУ ══

          Требование Влада: «выезжать должен именно такой текст, не похожие шрифты».
          Шрифтом это не гарантируется трижды: гарнитуру по картинке не опознать; названный
          в коде шрифт браузер молча подменяет следующим в стеке, если файла нет (ни сборка,
          ни линтер этого не покажут); хост Google Fonts вырезан из CSP боевого Caddy по
          152-ФЗ. Контуры снимают все три вопроса разом — и вопрос лицензии на гарнитуру в
          товарном знаке тоже.

          Система координат буквы: базовая линия y=0, высота прописной 100, строка 715 шириной.
          Положение и кегль сняты с референса: там прописная 104px при высоте шестиугольника
          309px, просвет от знака до «Y» — 29px.
        -->
        <g clip-path="url(#wordClip)">
          <g id="word" fill="#fff" transform="translate(379.1,251.7) scale(1.144)">
            <!-- Y -->
            <path d="M -1.4,-100.0 L 29.8,-100.5 L 58.7,-70.7 L 60.6,-70.7 L 88.5,-100.5 L 119.7,-100.0 L 70.7,-47.1 L 70.2,-2.4 L 47.6,-2.9 L 47.6,-47.1 L -1.0,-99.5 Z" />
            <!-- N -->
            <path d="M 129.3,-100.0 L 151.0,-100.5 L 209.6,-39.9 L 210.1,-100.0 L 232.7,-100.5 L 233.2,-2.9 L 211.5,-2.4 L 152.9,-63.0 L 152.4,-2.9 L 129.8,-2.4 L 129.3,-99.0 Z" />
            <!-- A — без перекладины и без просвета, «Λ». Это примета гарнитуры, не упрощение. -->
            <path d="M 295.7,-100.0 L 319.2,-100.5 L 320.7,-99.0 L 369.7,-6.7 L 370.2,-2.4 L 346.2,-2.4 L 344.7,-3.8 L 307.7,-72.6 L 270.7,-3.8 L 269.2,-2.4 L 244.7,-1.9 L 250.5,-15.4 L 295.7,-99.0 Z" />
            <!-- P — со скруглёнными углами чаши. -->
            <path d="M 381.2,-101.0 L 470.2,-100.5 L 476.0,-97.6 L 482.2,-91.3 L 485.1,-85.6 L 485.1,-54.8 L 476.9,-43.8 L 465.4,-38.9 L 405.8,-38.9 L 405.3,-1.9 L 382.7,-1.4 L 381.2,-2.9 L 381.7,-62.0 L 458.7,-62.0 L 463.0,-65.4 L 463.0,-76.0 L 456.7,-79.3 L 382.7,-78.4 L 381.2,-79.8 L 381.2,-100.0 Z" />
            <!-- S -->
            <path d="M 517.8,-101.0 L 601.4,-101.0 L 601.4,-80.8 L 600.0,-79.3 L 527.9,-79.3 L 524.0,-78.4 L 521.6,-75.0 L 521.6,-66.3 L 525.0,-63.0 L 582.7,-63.0 L 594.2,-58.2 L 600.5,-51.0 L 603.4,-41.3 L 602.4,-19.2 L 595.2,-7.2 L 582.7,-1.4 L 500.5,-1.9 L 501.0,-24.5 L 576.9,-24.5 L 580.3,-27.9 L 580.3,-36.5 L 577.9,-39.9 L 521.2,-39.9 L 510.6,-42.8 L 502.4,-50.0 L 498.6,-60.6 L 499.5,-84.6 L 503.4,-92.3 L 508.7,-97.6 L 517.3,-100.5 Z" />
            <!-- E -->
            <path d="M 616.8,-101.0 L 711.1,-101.0 L 712.0,-79.8 L 710.6,-78.4 L 641.3,-79.3 L 639.9,-77.9 L 640.4,-63.0 L 700.5,-62.5 L 700.5,-41.3 L 699.0,-39.9 L 640.4,-39.9 L 639.9,-25.0 L 713.5,-24.5 L 713.5,-1.4 L 616.8,-1.9 L 616.8,-100.0 Z" />
          </g>
        </g>
      </g>
      </g>
    </mask>

    <!--
      Тот самый «вырез в тёмно-синем фоне»: сам фон рисует страница, а здесь лежит
      подложка, видимая только сквозь маску.
      ⚠️ Вспышка и пульс висят ИМЕННО НА НЁМ, а не на содержимом маски: внутри маски
      важна ЯРКОСТЬ (она и есть прозрачность), и `brightness(4)` там не вспыхнул бы —
      белое ярче белого не станет, зато форма поехала бы. Здесь же фильтр красит то,
      что видно, и вспышка получается настоящей.
    -->
    <g id="lockup">
      <rect id="paint" x="-400" y="-400" width="2200" height="1400"
            fill="url(#gradBack)" mask="url(#logoMask)" />
    </g>

    <!--
      Молния НАМЕРЕННО вне маски и вне подложки: разряд обязан быть белым, а сквозь
      маску он взял бы цвет градиента и перестал читаться как электричество.
      ⚠️ Своего сдвига по горизонтали ей не нужно: она гаснет к 1390 мс, а замок
      разъезжается только с 1560 — то есть за всё время её жизни знак стоит на месте.
      Стартовое положение ставит `startIdle`.
    -->
    <g id="boltLayer">
      <g transform="translate(200,200)">
        <!-- Молния бьёт по линии между контактами, ПОД ними. -->
        <g id="bolt" opacity="0">
          <path d="M -48,-22 L -14,-3 L -28,3 L 48,24" fill="none" stroke="#EAFDFF"
                stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".5" />
          <path d="M -48,-22 L -14,-3 L -28,3 L 48,24" fill="none" stroke="#FFFFFF"
                stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
        </g>
      </g>
    </g>
  </svg>

  <p class="hint" id="hint">нажмите на логотип</p>
</div>

<aside class="dev" id="dev">
  <h2>Панель сверки</h2>
  <button id="replay" type="button">▶ Проиграть заново</button>
  <label>
    <span class="row">Скорость <span class="val" id="speedVal">1.0×</span></span>
    <input id="speedRange" type="range" min="25" max="200" value="100" />
  </label>
  <p class="note">Клавиша <b>H</b> — скрыть панель.<br>
    <b>?motion=1</b> — проиграть даже при системном «не двигать интерфейс».<br>
    <b>?state=final</b> — сразу собранный логотип.</p>
</aside>

<script>
/* ═══════════════════════════════════════════════════════════════════════════════
   ХОРЕОГРАФИЯ. Все числа — здесь и только здесь.
   ═══════════════════════════════════════════════════════════════════════════════ */
const CFG = {
  // ── ТРИ СЛОЯ ШЕСТИУГОЛЬНИКОВ ──
  // Осевые радиусы. Внутренний — сам знак (159.3, снят с референса); внешние взяты по
  // эскизу Влада в тех же пропорциях (×1.16 и ×1.34).
  hexR:     [159.3, 191.0, 222.0],
  // Каждый слой крутится В СВОЮ СТОРОНУ: «1-й по часовой, 2-й против часовой, 3-й по
  // часовой». Встречное вращение — единственное, по чему видно, что слоёв три, а не один
  // толстый контур: одинаково крутящиеся кольца читаются как одна фигура.
  hexDir:   [1, -1, 1],
  hexMs:    [26000, 15000, 20000],
  // Стартовые углы разведены, как на эскизе. Кратных 60° тут быть не должно: у
  // шестиугольника это тождественный поворот, и слои легли бы вершина в вершину.
  hexStart: [0, 21, 41],

  gatherMs:   1000,
  gatherTurns:   3,                 // оборотов вокруг СЕБЯ, пока летит внутрь

  boltAt:      930, boltMs: 460,
  linkAt:     1230, linkMs: 420,    // строго ПОСЛЕ удара: связь от разряда, а не сама
  flashAt:    1290, flashMs: 900, flashPeak: 4,
  wordAt:     1560, wordMs: 800, wordShift: 46,

  // Положение замка. Центр листа x=570; центр знака 200; центр собранного замка ≈ 620.6.
  lockIdle:    370,
  lockFinal:   -50.6,

  pulseAt:    2500, pulseMs: 2600, pulsePeak: 1.22,
};

/* Посадочные места контактов — СНЯТЫ С РЕФЕРЕНСА, а не подобраны:
   левый контакт (-79.2,-26.4), правый (74.8,43.5) от центра знака.
   Держим в полярном виде, потому что в нём же описана орбита — тогда посадка это
   интерполяция двух чисел, а не переход между системами координат. */
/* Посадочные места контактов — ВЕРШИНЫ шестиугольника «S», а не подобранные точки:
   левый садится на нижне-левый конец дуги «Λ», правый на верхне-правый конец «V».
   Числа выведены из RS=93: x = ±RS·cos30 = ±80.54, y = ∓RS/2 = ∓46.5. */
const SEAT = {
  L: { x: -80.54, y: -46.5 },
  R: { x:  80.54, y:  46.5 },
};

const $ = (id) => document.getElementById(id);
const stage = $('stage'), hint = $('hint');
const hexBig = $('hexBig'), bolt = $('bolt'), lockup = $('lockup');
/* Красим и вспыхиваем ПОДЛОЖКУ: содержимое маски белое, и фильтр там менял бы
   не цвет, а прозрачность. */
const paint = $('paint'), boltLayer = $('boltLayer');
const sLink = $('sLink'), word = $('word'), clipRect = $('wordClipRect');
const carve = { L: $('carveL'), R: $('carveR') };

/* Осевой радиус контакта на референсе. От него считается, во сколько раз слой увеличен
   в покое: многоугольник у слоя ТОТ ЖЕ, что у контакта, разница только в `scale`. */
const CONTACT_R = 27;

/* Два внешних слоя. `seat` — куда сядет; внутренний в таблицу не входит: он никуда не
   едет и не меняет размера, у него своя короткая анимация остановки. */
const LAYERS = [
  { el: $('hexMid'), i: 1, seat: 'L' },
  { el: $('hexOut'), i: 2, seat: 'R' },
];


const Q = new URLSearchParams(location.search);
/* «Не двигать интерфейс» уважаем, но у режима два ложных срабатывания, из-за которых
   прототип было бы нечем проверить: так отвечает headless-браузер и так бывает настроена
   рабочая машина целиком. Явный обход `?motion=1` умолчания НЕ меняет. */
const reduced = Q.get('motion') !== '1' && matchMedia('(prefers-reduced-motion: reduce)').matches;

const WORD_X = 379.1, WORD_Y = 251.7, WORD_K = 1.144;

let speed = 1;
let running = [];
let idle = new Map();

const ms = (v) => v / speed;

/** Строка transform спутника. Порядок функций ФИКСИРОВАН — см. комментарий в разметке. */
/**
 * Строка transform слоя. Порядок функций ФИКСИРОВАН и одинаков в покое и на посадке —
 * поэтому браузер честно интерполирует между ними ОДНОЙ анимацией. Разбей это на
 * вложенные группы, и придётся синхронизировать две.
 *
 * ⚠️ Слой не летит по орбите, он СЖИМАЕТСЯ К МЕСТУ: в покое смещение нулевое (он
 * концентричен знаку), в конце — смещение до контакта. Прежняя формула была полярной
 * (`rotate → translate(r) → rotate(-r)`) и годилась спутнику на кольце; здесь она
 * заставила бы слой описать дугу вокруг центра, а по эскизу он просто уменьшается.
 */
/**
 * Положение выреза. Он не двигается — только растёт от нуля к единице.
 *
 * 🔥 ЕДИНИЦЫ ОБЯЗАТЕЛЬНЫ, И ЭТО КУПЛЕНО ТИХИМ ОТКАЗОМ. Сначала здесь стоял синтаксис
 * SVG-АТРИБУТА (`translate(-84.87,-49)`, без единиц). Для атрибута это верно, а для
 * CSS-трансформа — нет: WAAPI молча выбрасывает такой кадр («Invalid keyframe value»
 * в консоли, и всё). Вырезы не анимировались ВООБЩЕ, а статический финал работал,
 * потому что он шёл через `setAttribute` — то есть дефект прятался ровно там, где я
 * его проверял. Поэтому и запись, и анимация идут теперь ОДНИМ путём — через
 * `style.transform` с единицами.
 */
function carveTf(key, k) {
  return `translate(${SEAT[key].x}px, ${SEAT[key].y}px) scale(${k})`;
}

function layerTf(x, y, deg, scale) {
  return `translate(${x}px, ${y}px) rotate(${deg}deg) scale(${scale})`;
}

/** Прогресс бесконечной анимации → текущий угол: посадка должна начаться ИЗ ТОЙ ЖЕ точки,
 *  где спутник сейчас, а не прыгнуть к началу круга. */
function angleOf(anim) {
  const p = anim?.effect?.getComputedTiming?.().progress;
  return (typeof p === 'number' ? p : 0) * 360;
}

function stopAll() {
  running.forEach((a) => { try { a.cancel(); } catch { /* уже мертва */ } });
  running = [];
  idle.clear();
}

/* ── ПОКОЙ ────────────────────────────────────────────────────────────────────── */
function startIdle() {
  stopAll();
  paint.style.filter = 'none';
  bolt.style.opacity = 0;
  sLink.style.opacity = 0;
  clipRect.setAttribute('width', 0);
  lockup.style.transform = `translateX(${CFG.lockIdle}px)`;
  boltLayer.style.transform = `translateX(${CFG.lockIdle}px)`;
  // Вырезов в покое НЕТ: дуги целые. Надкусить их там, где контакт ещё не стоит,
  // значило бы показать отступ вокруг пустого места.
  for (const k of ['L', 'R']) carve[k].style.transform = carveTf(k, 0);

  // Внутренний слой — сам знак: крутится на месте и никуда не уезжает.
  const a0 = CFG.hexStart[0], d0 = CFG.hexDir[0];
  const hexAnim = hexBig.animate(
    [{ transform: `rotate(${a0}deg)` }, { transform: `rotate(${a0 + 360 * d0}deg)` }],
    { duration: ms(CFG.hexMs[0]), iterations: Infinity, easing: 'linear' });
  idle.set(hexBig, hexAnim);
  running.push(hexAnim);

  // Два внешних: концентричны знаку, увеличены, крутятся каждый в свою сторону.
  for (const L of LAYERS) {
    const a = CFG.hexStart[L.i], dir = CFG.hexDir[L.i];
    const k = CFG.hexR[L.i] / CONTACT_R;
    const anim = L.el.animate(
      [{ transform: layerTf(0, 0, a, k) },
       { transform: layerTf(0, 0, a + 360 * dir, k) }],
      { duration: ms(CFG.hexMs[L.i]), iterations: Infinity, easing: 'linear' });
    idle.set(L.el, anim);
    running.push(anim);
  }
}

/* ── СБОРКА ───────────────────────────────────────────────────────────────────── */
function play() {
  const a0 = new Map();
  for (const [el, anim] of idle) a0.set(el, angleOf(anim));
  stopAll();

  const easeSeat = 'cubic-bezier(.22,.9,.18,1)';   // резкий разгон, длинное торможение

  // 1. Внутренний слой останавливается. Целимся в кратное 60°: поворот на 60° у
  //    шестиугольника неотличим от нуля, значит «ровное» положение достижимо без рывка
  //    в любую сторону — от текущего угла всегда вперёд.
  const h0 = a0.get(hexBig) || 0;
  running.push(hexBig.animate(
    [{ transform: `rotate(${h0}deg)` }, { transform: `rotate(${Math.ceil(h0 / 60) * 60 + 60}deg)` }],
    { duration: ms(CFG.gatherMs), easing: easeSeat, fill: 'forwards' }));

  // 2. Два внешних слоя быстро крутятся, уменьшаются и садятся контактами.
  //    Угол доворота считается ОТ ТЕКУЩЕГО (`a0`), а не от нуля: иначе слой в момент
  //    нажатия прыгнул бы к началу круга, и вращение выглядело бы рваным.
  for (const L of LAYERS) {
    const start = a0.get(L.el) || 0;
    const dir = CFG.hexDir[L.i];
    const k = CFG.hexR[L.i] / CONTACT_R;
    const p = SEAT[L.seat];
    // 🔥 УГОЛ ПОСАДКИ КРАТЕН 60°, И ЭТО НЕ ПРИДИРКА. Раньше слой останавливался там,
    // куда его донесло вращение, — то есть под случайным углом, и контакты стояли
    // «криво» относительно рамки (жалоба Влада). У шестиугольника поворот на 60°
    // тождественный, поэтому ближайшее кратное 60 даёт ровное положение и при этом
    // почти не меняет длину пути: доворот не больше 30°.
    const endDeg = Math.round((start + 360 * CFG.gatherTurns * dir) / 60) * 60;
    running.push(L.el.animate(
      [
        { transform: layerTf(0, 0, start, k) },
        { transform: layerTf(p.x, p.y, endDeg, 1) },
      ],
      { duration: ms(CFG.gatherMs), easing: easeSeat, fill: 'forwards' }));

    // Вырез раскрывается ТЕМ ЖЕ движением и в тот же срок, что и посадка: отступ
    // вокруг контакта обязан появиться ровно тогда, когда появляется сам контакт.
    running.push(carve[L.seat].animate(
      [{ transform: carveTf(L.seat, 0) }, { transform: carveTf(L.seat, 1) }],
      { duration: ms(CFG.gatherMs), easing: easeSeat, fill: 'forwards' }));
  }

  // 4. Молния: живёт ровно столько, сколько горит. Держать дольше — превратить разряд в
  //    статичную деталь знака.
  running.push(bolt.animate(
    [
      { opacity: 0, transform: 'scale(.5)' },
      { opacity: 1, transform: 'scale(1)', offset: .2 },
      { opacity: .45, offset: .42 },
      { opacity: 1, offset: .6 },
      { opacity: 0 },
    ],
    { duration: ms(CFG.boltMs), delay: ms(CFG.boltAt), easing: 'ease-out' }));

  // 5. Перемычка раскрывается ОТ ЦЕНТРА: связь растёт из места разряда, а не выезжает
  //    с одной стороны.
  running.push(sLink.animate(
    [{ opacity: 0, transform: 'scale(.05)' }, { opacity: 1, transform: 'scale(1)' }],
    { duration: ms(CFG.linkMs), delay: ms(CFG.linkAt),
      easing: 'cubic-bezier(.2,1.1,.3,1)', fill: 'forwards' }));

  // 6. Вспышка: быстрый набор, медленный спад — иначе это мигание лампы, а не разряд.
  running.push(paint.animate(
    [
      { filter: 'saturate(1) brightness(1)' },
      { filter: `saturate(0) brightness(${CFG.flashPeak}) drop-shadow(0 0 26px rgba(255,255,255,.9))`,
        offset: .14 },
      { filter: 'saturate(1) brightness(1)' },
    ],
    { duration: ms(CFG.flashMs), delay: ms(CFG.flashAt), easing: 'ease-out' }));

  // 7. Слово выезжает, знак ОДНОВРЕМЕННО уезжает влево: разведи их по времени — и логотип
  //    «прыгнет» на месте перед появлением текста.
  const t = { duration: ms(CFG.wordMs), delay: ms(CFG.wordAt),
              easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' };
  running.push(lockup.animate(
    [{ transform: `translateX(${CFG.lockIdle}px)` }, { transform: `translateX(${CFG.lockFinal}px)` }], t));
  running.push(clipRect.animate([{ width: '0px' }, { width: '900px' }], t));
  running.push(word.animate(
    [{ transform: `translate(${WORD_X - CFG.wordShift}px, ${WORD_Y}px) scale(${WORD_K})` },
     { transform: `translate(${WORD_X}px, ${WORD_Y}px) scale(${WORD_K})` }], t));

  // 8. Пульс — бесконечный и НАМЕРЕННО слабый: заметно мигающий логотип читается как
  //    ошибка отрисовки, здесь он должен только «дышать».
  running.push(paint.animate(
    [
      { filter: 'saturate(1) brightness(1)' },
      { filter: `saturate(.88) brightness(${CFG.pulsePeak}) drop-shadow(0 0 12px rgba(255,255,255,.3))` },
      { filter: 'saturate(1) brightness(1)' },
    ],
    { duration: ms(CFG.pulseMs), delay: ms(CFG.pulseAt), iterations: Infinity,
      easing: 'ease-in-out' }));

  hint.classList.add('gone');
}

/** Собранное состояние без единого движения. */
function showFinal() {
  stopAll();
  hexBig.style.transform = 'rotate(0deg)';
  for (const L of LAYERS) {
    const p = SEAT[L.seat];
    L.el.style.transform = layerTf(p.x, p.y, 0, 1);   //0 кратен 60 — ровно
    carve[L.seat].style.transform = carveTf(L.seat, 1);
  }
  sLink.style.opacity = 1;
  clipRect.setAttribute('width', 900);
  lockup.style.transform = `translateX(${CFG.lockFinal}px)`;
  boltLayer.style.transform = `translateX(${CFG.lockFinal}px)`;
  hint.classList.add('gone');
}

/* ── УПРАВЛЕНИЕ ───────────────────────────────────────────────────────────────── */
function replay() {
  if (reduced) { showFinal(); return; }
  hexBig.style.transform = '';
  lockup.style.transform = '';
  boltLayer.style.transform = '';
  for (const L of LAYERS) { L.el.style.transform = ''; L.el.style.opacity = ''; }
  hint.classList.remove('gone');
  startIdle();
}

stage.addEventListener('click', () => { if (!reduced) play(); });
stage.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!reduced) play(); }
});
$('replay').addEventListener('click', (e) => { e.stopPropagation(); replay(); });
$('speedRange').addEventListener('input', (e) => {
  speed = e.target.value / 100;
  $('speedVal').textContent = speed.toFixed(1) + '×';
});
addEventListener('keydown', (e) => { if ('hHрР'.includes(e.key)) $('dev').classList.toggle('hidden'); });

if (reduced || Q.get('state') === 'final') showFinal();
else startIdle();
</script>

  1. ВЕКТОРНЫЙ ОРИГИНАЛ. Контуры сняты с JPEG: разрешение знака в референсе 266×309,
     буквы — прописная 104px. Обводка попадает в углы с точностью около пикселя, то есть
     ~0.4% размера. На экране это незаметно, на печати и на большом баннере — заметно.
     Если у Арины есть исходник (.ai/.svg/.fig) — контуры надо взять оттуда, а этот файл
     оставить ради хореографии. Скрипт обводки лежит рядом и повторяем.

  2. ГДЕ ЭТО БУДЕТ ЖИТЬ. На экране входа продукта SVG и WAAPI подойдут как есть. В
     мобильном приложении помнить: всё из web/public/ едет в OTA-бандл на КАЖДЫЙ телефон,
     поэтому логотип должен остаться векторным и лёгким.
