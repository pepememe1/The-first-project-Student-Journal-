# /etc/ssh/sshd_config.d/04-gradebook-limits.conf (28.10.2026)
#
# Порт 22 круглые сутки перебирают боты. Каждый держит место «не вошёл» до двух минут
# (LoginGraceTime 120), а при десяти таких местах sshd начинает случайно сбрасывать
# новые подключения (MaxStartups 10:30:100) — под сброс попадали и наш вход, и выкладка.
# Ключ проходит проверку за доли секунды, поэтому 20 секунд хватает с запасом, а мест
# для боевого входа становится втрое больше. Вход по паролю выключен в 01-gradebook-hardening.conf.
LoginGraceTime 20
MaxStartups 30:30:120
