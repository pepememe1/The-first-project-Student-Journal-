# GradeBookAI: автообновления — ночью по Улан-Удэ (14.10.2026).
# Кладётся в /etc/systemd/system/apt-daily-upgrade.timer.d/gradebook.conf.
#
# Стандартный таймер Ubuntu — 06:00 по зоне машины плюс до часа разброса. Машина живёт по
# Москве, значит обновление с возможным перезапуском служб и перезагрузкой приходилось на
# 11:00–12:00 по Улан-Удэ, то есть на середину пар. Сдвигаем в 02:00 по Иркутску: после
# ночного снимка базы (00:00) и до утра.
[Timer]
OnCalendar=
OnCalendar=*-*-* 02:00:00 Asia/Irkutsk
RandomizedDelaySec=15min
