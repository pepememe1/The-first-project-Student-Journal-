apply plugin: 'com.android.application'

// Подпись release-сборки (RuStore): ключ и пароли берём из keystore.properties (вне git).
// Нет файла (напр. на CI без секретов) — release просто не подпишется этим ключом.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "ru.esstu.gradebook"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.esstu.gradebook"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        //RuStore требует БОЛЬШИЙ versionCode на каждую новую сборку. 2 → 3 → 4 → 5 → 6
        //(4 — перезалив после отклонения по скриншотам: контент прежний, версия для перезагрузки).
        //6 — первая сборка, где ПУШИ реально работают: мост к нативной части раньше
        //стирался при загрузке страницы, и токен устройства не доезжал до сервера
        //(в боевой базе не было ни одного). Здесь же — иконка и заставка из общего
        //icon.png и снятие service worker'а, из-за которого не приживались OTA-обновления.
        //7 — ВИДЖЕТ РАСПИСАНИЯ на рабочем столе. Перезалив APK здесь обязателен: виджет
        //это НАТИВНАЯ часть (AppWidgetProvider + разметка + приёмник в манифесте), и
        //«по воздуху» через Capgo он не доедет — OTA подменяет только веб-бандл.
        //8 — недельная сессия для мобильного клиента (заголовок X-Client: android) и
        //снимок расписания для виджета в момент ВХОДА, а не при заходе в раздел.
        //9 — виджет обновляется САМ через публичный /public/schedule (без токена, только
        //https). До этого он жил снимком с последнего входа: человек мог не открывать
        //приложение неделями, а расписание за это время правили — и виджет уверенно
        //показывал не то. Перезалив APK обязателен: это нативная часть, OTA её не везёт.
        versionCode 13
        versionName "1.0.12"
        //project_id из консоли RuStore подставляется в манифест. Держим в
        //gradle.properties (файл вне git), чтобы не зашивать идентификатор в исходники.
        manifestPlaceholders = [
            rustoreProjectId: project.findProperty("RUSTORE_PROJECT_ID") ?: ""
        ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Подписываем release-ключом, только если keystore.properties есть.
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    //RuStore Push. Именно он, а не Firebase: приложение раздаётся через RuStore, и на
    //части телефонов российской аудитории сервисов Google нет — FCM там молчит без
    //единой ошибки, то есть студент просто не получает уведомления и никто не узнает.
    implementation "ru.rustore.sdk:pushclient:$rustorePushVersion"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    //⚠️ org.json в JVM-юнит-тестах Android — ЗАГЛУШКА: все методы кидают
    //"not mocked", то есть контрактный тест виджета (WeekParityContractTest) без
    //настоящей реализации падал бы не по делу. Подкладываем настоящую библиотеку
    //ТОЛЬКО в тесты — в APK она не попадает, там работает системная.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
