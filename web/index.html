<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget=resizes-content: экранная клавиатура УМЕНЬШАЕТ область
         контента (а не наезжает поверх) — чат/поле ввода остаются видимыми над ней.
         maximum-scale=1 + user-scalable=no: сайт НЕ масштабируется (щипок/двойной тап) —
         только вертикальная прокрутка контента. Без этого фокус на текстовом поле на
         телефоне (композер мессенджера) заставлял браузер САМ «приближать» экран к полю
         ввода — так задумано мобильными Safari/Chrome для мелкого текста, при
         user-scalable=no это поведение подавляется. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#147C8B" />
    <title>Электронный журнал — Технологический колледж ВСГУТУ</title>

    <!-- PWA: устанавливаемое приложение (Android/десктоп — из манифеста; iOS — из
         apple-* мета). Регистрация service worker — в src/main.js (CSP запрещает
         inline-скрипты, а модуль main.js грузится с 'self'). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GradeBookAI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Фирменные шрифты Synapse (Syne — заголовки, DM Sans — текст) лежат СВОИМИ файлами
         в /fonts и объявлены в src/style.css. Ссылки на fonts.googleapis.com здесь БОЛЬШЕ
         НЕТ: внутри программы (offline-first) она не работала вовсе, а её IP-запрос к
         Google был лишним для 152-ФЗ — подробности в комментарии @font-face. Предзагрузка
         только для заголовочного Syne: им нарисован знак «GB», который виден сразу. -->
    <link rel="preload" href="/fonts/Syne-Variable.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
