<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#147C8B" />
    <title>Электронный журнал — Технологический колледж ВСГУТУ</title>

    <!-- PWA: устанавливаемое приложение (Android/десктоп — из манифеста; iOS — из
         apple-* мета). Регистрация service worker — в src/main.js (CSP запрещает
         inline-скрипты, а модуль main.js грузится с 'self'). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GradeBookAI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Фирменные шрифты Synapse: Syne (заголовки) + DM Sans (текст). Есть системный
         fallback (Segoe UI) — если шрифты не загрузились, вид остаётся предсказуемым.
         Для полностью офлайн-работы шрифты можно самостоятельно положить в /public/fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
