# ============================================================
# nginx.conf — альтернатива Caddy для «одного адреса» (сайт + API).
# Рекомендуемый вариант — Caddy (см. Caddyfile: авто-HTTPS). Nginx подойдёт, если
# он уже развёрнут; сертификат тогда через certbot (Let's Encrypt).
#
# SPA-статику кладём в /var/www/gradebookai/dist (результат `npm run build`),
# API-префиксы проксируем в uvicorn (127.0.0.1:8000).
# ============================================================

server {
    listen 443 ssl http2;
    server_name gradebookai.ru;

    # ssl_certificate     /etc/letsencrypt/live/gradebookai.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gradebookai.ru/privkey.pem;

    root /var/www/gradebookai/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API → FastAPI. Реальный IP клиента передаём в X-Forwarded-For (нужно
    # серверному анти-брутфорсу /auth/login).
    location ~ ^/(auth|me|sync|admin|connect|web|health|docs|openapi\.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: любые прочие пути отдаём index.html (клиентский роутинг Vue Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
