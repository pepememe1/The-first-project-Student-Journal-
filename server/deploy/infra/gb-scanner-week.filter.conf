# /etc/fail2ban/filter.d/gb-scanner-week.conf — строки «[caddy-scanner] Ban <адрес>»
# из /var/log/fail2ban.log, разбор как у штатного recidive.conf. «Restore Ban» после
# перезапуска не считается: это тот же бан, а не возвращение бота.
[INCLUDES]
before = common.conf

[Definition]
_daemon = (?:fail2ban(?:-server|\.actions)\s*)
failregex = ^%(__prefix_line)s(?:\s*fail2ban\.actions\s*%(__pid_re)s?:\s+)?NOTICE\s+\[caddy-scanner\]\s+Ban\s+<HOST>\s*$
datepattern = ^{DATE}
ignoreregex =
