# /etc/fail2ban/jail.d/caddy-scanner.conf — фильтр в caddy-scanner.filter.conf.
#
# Один запрос к .php, wp-admin, .env и подобному — уже бан на сутки (28.10.2026, решение
# Ярослава): PHP и WordPress у нас нет, живой человек такой адрес не откроет никогда, а
# разведчики шлют по одному запросу в день, и прежние «три за 10 минут» их не ловили.
# Вернулся после разбана — бан на неделю в gb-scanner-week.conf.
[caddy-scanner]
enabled  = true
backend  = auto
logpath  = /var/log/caddy/access.log
port     = http,https
filter   = caddy-scanner
maxretry = 1
findtime = 10m
bantime  = 1d
