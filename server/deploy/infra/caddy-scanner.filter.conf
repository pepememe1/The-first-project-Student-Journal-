# Сканеры и разведка по журналу Caddy (JSON).
#
# ⚠️ ПРИНЦИП: банить ТОЛЬКО за поведение, которого у живого пользователя не бывает
# НИКОГДА. Ни один студент не запрашивает /.env, /.git/config или /wp-login.php —
# такие запросы шлют исключительно автоматические сканеры.
#
# 🔒 ЗДЕСЬ НЕТ И НЕ ДОЛЖНО БЫТЬ неудачных входов (401/429 на /auth/*). Причина:
# студенты массово сидят за VPN и мобильным NAT (у вузов глушат связь), и за одним
# выходным адресом сидит целая группа. Бан по неудачному входу закрыл бы вход всем
# соседям за тот же адрес. Перебор паролей ловится в приложении, по паре (IP, логин)
# и по несуществующим логинам — см. server/app/throttle.py.
[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"uri":"[^"]*(?:\.env|\.git/|\.svn|wp-admin|wp-login|xmlrpc\.php|phpmyadmin|phpMyAdmin|\.aws/|\.ssh/|/vendor/|/cgi-bin/|\.php|/actuator|/solr/|/druid/|/_ignition)[^"]*".*$
ignoreregex =
journalmatch =
