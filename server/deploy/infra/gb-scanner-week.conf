# /etc/fail2ban/jail.d/gb-scanner-week.conf (28.10.2026)
#
# Второй бан сканера за неделю — уже на неделю. Читает журнал самого fail2ban: адрес,
# который caddy-scanner банил дважды, вернулся после суточного разбана, то есть это бот,
# который ходит к нам каждый день. Не навсегда — решение Ярослава: через неделю бот
# возвращается и снова попадает в статистику приманок, а она нужна для отчётов.
#
# Бан только на 80/443, не на все порты: за одним выходом VPN или мобильного NAT сидят
# и студенты, и наши админы, и бан SSH отрезал бы нас от собственного сервера.
# Окно 7 дней — столько журнала fail2ban держит logrotate (weekly).
#
# Адреса Cloudflare на неделю не баним: больше половины «каждодневных» сканеров ходят
# через Cloudflare Workers, и их адрес делят с ними все, кто идёт через ту же сеть.
# Сутки они получают в caddy-scanner, а сами запросы из Workers Caddy отбивает по
# заголовку Cf-Worker (server/Caddyfile). Список — https://www.cloudflare.com/ips/.
[gb-scanner-week]
enabled  = true
backend  = auto
logpath  = /var/log/fail2ban.log
port     = http,https
filter   = gb-scanner-week
maxretry = 2
findtime = 7d
bantime  = 7d
ignoreip = 127.0.0.1/8 ::1
