# ============================================================
# pyproject.toml — зависимости и настройки инструментов GradeBookAI.
#
# С 3.6 здесь ЖИВУТ И ЗАВИСИМОСТИ (uv), а не только конфиг ruff/black/mypy.
#
# ━━ ЗАЧЕМ ЗАВИСИМОСТИ ПЕРЕЕХАЛИ СЮДА ━━
# Раньше они лежали в ДВУХ requirements.txt (корневой — десктоп, server/ — бэкенд) с
# версиями «не ниже» и без единого замка. Это давало три постоянные проблемы, и все три
# уже стоили времени:
#   • «у меня работает, у тебя нет» — двое ставили РАЗНЫЕ версии одних и тех же пакетов,
#     и расхождение вылезало не при установке, а странным поведением через неделю
#     (см. историю с pywebview под двумя Python на одной машине);
#   • сборка .exe тянет то, что стоит В ОКРУЖЕНИИ (§8.1): без фиксации состав сборки
#     зависел от того, что человек когда-то поставил рядом «на попробовать» — так exe
#     однажды и вырос со 49 до 135 МБ;
#   • у покупателя (проприетарная поставка) не было способа воспроизвести ИМЕННО ту
#     комбинацию версий, на которой продукт проверен.
# Здесь один источник и один замок `uv.lock` — воспроизводимая установка одной командой.
#
# ━━ ПОЧЕМУ uv, А НЕ pip/poetry ━━
# uv (Astral, Rust) резолвит и ставит на порядок быстрее pip, сам подтягивает нужный
# Python (на машине с двумя интерпретаторами это снимает целый класс наших проблем),
# держит ОДИН лок на все группы зависимостей и понимает стандартный PEP 621 `[project]`.
# То есть уход обратно на pip ничего не ломает: файл остаётся обычным pyproject.
#
# ━━ КОМАНДЫ ━━
#   uv sync --extra desktop --extra server --extra dev   # всё для разработки
#   uv sync --extra server                               # боевой VPS: только бэкенд
#   uv run pytest              /   cd server && uv run pytest
#
# ⚠️ requirements.txt и server/requirements.txt ОСТАВЛЕНЫ рабочими: боевой VPS
# разворачивается ими прямо сейчас, и менять способ установки на живом сервере в том же
# заходе, что и функциональный релиз, — верный способ уронить прод в неудачный момент.
# Они стали ПРОИЗВОДНЫМИ: правим здесь, отражаем там. Порядок полного перехода (и
# переезда в пакет `gradebook/`) — docs/PLAN-PACKAGING.md.
#
# Философия внедрения линтера прежняя: НЕ ломать существующий код гигантским рефактором.
# Правила — высокосигнальный минимум (реальные баги, не «вкусовщина»), типы постепенно.
# ============================================================

[project]
name = "gradebookai"
version = "3.6.0"
description = "GradeBookAI — электронный журнал успеваемости (десктоп + сервер + веб)"
requires-python = ">=3.10"
# Ядро — то, без чего не работает НИЧЕГО: шифрование ПДн, хеш пароля, HTTP, экспорт.
# Держим здесь, а не в extras, чтобы ЛЮБАЯ установка была работоспособной.
dependencies = [
    "requests>=2.31",
    # Обязательна: шифрование ПДн (Fernet) и защита ключей. Слабого фолбэка нет (152-ФЗ).
    "cryptography>=42.0",
    # ГОСТ-этап хеша пароля (PBKDF2-Стрибог512, Р 50.1.111-2016). На боевом Linux ГОСТ
    # считает OpenSSL GOST-engine, и тогда пакет не нужен — бэкенд выбирается сам.
    "gostcrypto>=1.2.5",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# ── Десктоп ────────────────────────────────────────────────────────────────────────
# ⚠️ PySide6 ЗДЕСЬ БОЛЬШЕ НЕТ. Он держался как «запасная оболочка», но в релизный .exe
# не входил никогда (--nofollow-import-to=PySide6), то есть у людей не исполнялся ни
# разу; при этом одни только pyside6-addons весят 168 МБ и ставились каждому, кто делал
# `uv sync --extra desktop`. Нативные экраны заменены тем же Vue-SPA, который поднимает
# локальный сервер (§11 «один интерфейс»). Исходники — WORK/GB-legacy-qt.
desktop = [
    "pywebview>=6.0; sys_platform == 'win32'",
    # Локальный сервер внутри программы — ТОТ ЖЕ server/app на 127.0.0.1 (§11 «один UI»).
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "SQLAlchemy>=2.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "webauthn>=2.0",
    "httpx>=0.27",
    "sqlcipher3>=0.5; sys_platform == 'win32'",
    # Дельта-обновления (data/updater.py). Импорт ЛЕНИВЫЙ: без пакета обновления просто
    # идут полной закачкой, сборка остаётся рабочей.
    "zstandard>=0.22",
    # Vector через GigaChat. Без пакета — офлайн-шаблоны / Ollama.
    "gigachat>=0.1",
]

# ── Сервер ─────────────────────────────────────────────────────────────────────────
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "SQLAlchemy>=2.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "webauthn>=2.0",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "gigachat>=0.1",
    # Шифрование файла БД (SQLCipher, AES-256) — ПДн at rest. Только Linux: под Windows
    # готового wheel нет, там разработка идёт без шифрования файла.
    "sqlcipher3-binary>=0.5; sys_platform == 'linux'",
    # Перевод мессенджера — обёртка над translate.google.com (см. translate_service.py).
    "deep-translator>=1.11",
    # Парсер учебных планов ВСГУТУ: планы отдаются PDF, а не xlsx.
    "pdfplumber>=0.11",
]

# ── Разработка ─────────────────────────────────────────────────────────────────────
dev = [
    "pytest>=8.0",
    # Пересборка фирменных шрифтов в woff2 для web/public/fonts (tools/build_web_fonts.py).
    "fonttools>=4.50",
    "brotli>=1.1",
]

# ⚠️ package = false — корень НЕ является устанавливаемым пакетом.
# Клиентский код лежит пакетами `desktop/ sync/ data/` + несколько КОРНЕВЫХ модулей
# (grading, study_hours, app_paths…), которые импортирует и сервер. Пока корневые модули
# не переехали в общий пакет, собирать из корня дистрибутив нечего — см.
# docs/PLAN-PACKAGING.md. `_bootstrap.py` удалён, sys.path больше никто не правит.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
# Не линтуем сгенерированное/чужое: сборки, веб-фронт (у него свой eslint), артефакты.
extend-exclude = ["build", "dist", "nuitka_out", "web", "*.spec"]

[tool.ruff.lint]
# Стартовый набор — только высокосигнальные правила (ловят настоящие ошибки, а не стиль):
#   F   — pyflakes: неопределённые имена, неиспользуемые импорты/переменные, дубли;
#   E9  — синтаксические ошибки (то, что раньше ловил только compileall);
#   W605 — некорректные escape-последовательности в строках (частый тихий баг в regex).
# По мере наведения порядка можно добавлять: I (сорт импортов), UP, B, SIM.
#   B    — flake8-bugbear: реальные ловушки (raise без from, неиспользуемые loop-var,
#          zip без strict и т.п.). B008 отключаем: `Depends(...)`/`Body(...)` в дефолтах —
#          ШТАТНЫЙ паттерн FastAPI, а не ошибка.
select = ["F", "E9", "W605", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# В тестах допускаем «неиспользованные» импорты-фикстуры и локальные переменные-проверки.
"tests/**" = ["F401", "F841"]
"server/tests/**" = ["F401", "F841"]
#Ядро пакета мессенджера — файл РЕ-ЭКСПОРТА: половина его импортов нужна не ему,
#а модулям пакета, которые берут их через `from ._common import *`.
#⚠️ Почему нельзя просто перечислить имена в `__all__` вручную, как в routers/web:
#там ровно на этом уже обожглись — имя добавили в импорт и забыли в `__all__`,
#получив NameError в рантайме при зелёной компиляции. Здесь `__all__` считается
#из самого модуля и забыть нечего, но ruff тогда не видит имена и честно ругается.
"server/app/routers/messenger/_common.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "(build|dist|nuitka_out|web)/"

[tool.mypy]
python_version = "3.10"
# Внедряем типы ПОСТЕПЕННО: сейчас mypy проверяет только уже «чистые» модули без
# внешних GUI/сетевых зависимостей. Список расширяем по мере простановки аннотаций —
# так проверка типов остаётся ЗЕЛЁНОЙ и полезной, а не «1000 ошибок, все игнорируют».
ignore_missing_imports = true
warn_unused_ignores = true
#Корень репозитория: там лежат общие модули (grading, study_hours, app_paths…), а
#desktop/ sync/ data/ — обычные пакеты и находятся сами.
mypy_path = "."
#follow_imports=silent: типы из импортов ПОДТЯГИВАЕМ, но ошибки в ещё-не-типизированных
#транзитивных модулях (core и пр.) НЕ репортим — иначе один непроверенный модуль топит
#всю проверку. Так mypy остаётся зелёным и полезным на уже аннотированных файлах.
follow_imports = "silent"
#⚠️ Модуль попадает сюда, только когда чист ЦЕЛИКОМ (иначе проверка уходит в красное
#и её перестают читать). Синк добавлен 18.08.2026: три модуля разом стали зелёными
#после снятия неявных Optional и аннотаций у полей, начинающихся с None.
files = ["data/terms.py", "data/exports.py", "grading.py", "log.py", "app_paths.py",
         "sync/sync_client.py", "sync/sync_runner.py", "sync/sync_engine.py"]
